[pytest]
# -n 4, not -n auto: this only needs enough worker processes to keep each
# one's share of GUI-instantiating tests comfortably under Windows' GDI
# object quota (see requirements-test.txt) -- 4 easily does that. -n auto
# spawns one worker per CPU core (16 on a typical modern machine), and
# launching that many simultaneously (each importing numpy/PIL/cupy, then
# creating its own Tcl interpreter) caused a real, reproduced-once
# transient failure: one worker's Tcl couldn't read its own init.tcl
# ("No error"), a classic symptom of filesystem contention under a burst
# of concurrent process startup, not a logic bug. Isolated or under -n 4,
# it doesn't recur.
# --dist=loadfile: all tests in one file always run in the same worker, so
# module-scoped fixtures (e.g. tests/tools/gen_modelbin_gui/conftest.py's
# tk_root) behave exactly as they do serially -- xdist just runs multiple
# files' worth of workers in parallel, each in its own OS process.
addopts = -n 4 --dist=loadfile
