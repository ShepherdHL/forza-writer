[pytest]
# -n 4: enough worker processes to parallelize the suite without the
# startup contention a full -n auto (one per CPU core) causes when every
# worker imports numpy/PIL/etc. at once.
# --dist=loadfile: all tests in one file always run in the same worker, so
# module-scoped fixtures behave exactly as they do serially -- xdist just
# runs multiple files' worth of workers in parallel, each in its own OS
# process.
addopts = -n 4 --dist=loadfile
